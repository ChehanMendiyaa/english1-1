<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Technology and Its Impact on Everyday Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Sora:wght@600;800&display=swap" rel="stylesheet">

<style>
  :root{--bg:#101426;--v:#8B5CF6;--c:#22D3EE;--p:#F472B6;--e:#34D399;--y:#FBBF24;--t2:#C5CEE0}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(14px,.62vw + .85vh,26px)}
html,body{height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
a{color:var(--c)}a:focus-visible,button:focus-visible{outline:3px solid var(--y);outline-offset:3px}
.bg i{position:fixed;border-radius:50%;filter:blur(90px);opacity:.33;animation:fl 18s ease-in-out infinite alternate;pointer-events:none}
.bg i:nth-child(1){width:40vw;height:40vw;background:var(--v);top:-10vw;left:-8vw}
.bg i:nth-child(2){width:35vw;height:35vw;background:var(--c);bottom:-12vw;right:-6vw;animation-delay:-6s}
.bg i:nth-child(3){width:25vw;height:25vw;background:var(--p);top:40%;left:55%;animation-delay:-12s;opacity:.16}
@keyframes fl{to{transform:translate(6vw,5vh) scale(1.15)}}
#bar{position:fixed;top:0;left:0;right:0;height:5px;background:rgba(255,255,255,.08);z-index:9}
#prog{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--v),var(--c),var(--p));transition:width .45s}
#deck{position:fixed;inset:0}
.slide{--a:var(--v);--b:var(--c);position:absolute;inset:0;padding:6vh 7vw 13vh;display:none;flex-direction:column;overflow:hidden}
.slide.on{display:flex;animation:slideIn .58s cubic-bezier(.22,.75,.25,1) both}
@keyframes slideIn{from{opacity:0;transform:translate3d(2.5vw,0,0) scale(.985);filter:blur(2px)}to{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}}
.fit{flex:none;margin:auto 0;display:flex;flex-direction:column;gap:2.2vh;transform-origin:top left}
.k{color:var(--a);letter-spacing:.2em;text-transform:uppercase;font-size:1rem;font-weight:600}
h1,h2,h3,.num,.big{font-family:Sora,Inter,sans-serif}
h2{font-weight:800;font-size:clamp(2rem,3.2vw,3.6rem);line-height:1.1;background:linear-gradient(90deg,#fff 30%,var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
h3{font-size:1.3rem;margin-bottom:.4rem}
.lead{color:var(--t2);font-size:1.3rem;max-width:75ch;margin-top:.5rem}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(12px);border-radius:1.2rem;padding:1.1rem 1.4rem;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.hd{display:grid;grid-template-columns:1fr 24%;gap:3vw;align-items:stretch}.hd .ph{min-height:11rem}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:2.5vw}.two .ph{min-height:18rem}
.col{display:flex;flex-direction:column;gap:1.2rem}
.pn,.vs{display:grid;grid-template-columns:1fr 1fr;gap:1.4vw}
ul{list-style:none}
.card li{font-size:1.15rem;padding:.2rem 0 .2rem 1.4rem;position:relative}
.card li::before{content:"\203A";position:absolute;left:0;color:var(--a);font-weight:800}
.pos li::before{content:"\2713";color:var(--e)}.neg li::before{content:"!";color:var(--p)}
.pos{border-top:3px solid var(--e)}.neg{border-top:3px solid var(--p)}
.exs{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.8rem}
.ex{display:flex;gap:.8rem;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:1rem;padding:.8rem 1rem}
.ex b{display:block;font-size:1.15rem}.ex small{color:var(--t2);font-size:1rem;line-height:1.25;display:block}
.lg{flex:none;width:3rem;height:3rem;border-radius:.8rem;background:#fff;display:grid;place-items:center}
.lg img{width:2rem;height:2rem;object-fit:contain;display:block;content-visibility:auto}
.lg{flex-shrink:0;overflow:hidden}
.lg img{image-rendering:auto}
.lg img[loading="lazy"]{opacity:0;animation:logoReveal .22s ease-out forwards}
@keyframes logoReveal{to{opacity:1}}
.lg.x img{display:none}.lg.x::before{content:attr(data-i);font:800 1.3rem Sora,sans-serif;color:var(--bg)}
.lg.t{background:var(--a);color:#fff;font-size:1.5rem}
.ph{position:relative;border-radius:1.4rem;overflow:hidden;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 14px 50px rgba(0,0,0,.4)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(16,20,38,.65))}
.take{border-left:.35rem solid var(--a);background:rgba(255,255,255,.07);border-radius:.8rem;padding:.9rem 1.4rem;font-weight:600;font-size:1.35rem}
.cg{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2vw}
.cg.one{grid-template-columns:1.7fr 1fr}
.ch{display:flex;flex-direction:column;gap:.6rem}
.ch figcaption b{display:block;font-size:1.3rem}.ch figcaption small{color:var(--t2);font-size:.95rem;display:block}
.cv{position:relative;height:38vh}
.note{color:var(--t2);font-size:1.1rem}.src{font-size:1rem;color:var(--t2)}.src a{word-break:break-word}
.big{font-size:3rem}
.steps .card{padding:1.8rem}.steps .big{font-size:4.8rem;line-height:1}.steps h3{font-size:1.6rem}.steps .note{font-size:1.3rem}
.st{display:flex;flex-direction:column;gap:.5rem;border-top:4px solid var(--a);justify-content:center}
.num{font-weight:800;font-size:4.6rem;line-height:1;color:var(--a)}
.st h3{font-size:1.35rem}.st p{font-size:1.1rem;color:var(--t2)}.st .meta{color:#fff;font-weight:600;font-size:1rem}
.dash{display:grid;grid-template-columns:repeat(6,1fr);gap:1.4vw}
.dash .st{grid-column:span 2;padding:1.4rem 1.6rem}.dash .st:nth-child(n+4){grid-column:span 3}
.it{display:flex;gap:.9rem;align-items:flex-start;padding:.45rem 0}.it span{font-size:1.9rem}.it b{display:block;font-size:1.2rem}.it small{color:var(--t2);font-size:1.02rem}
.vs h3{font-size:1.6rem}
.tips{display:grid;grid-template-columns:repeat(12,1fr);gap:1.2vw}
.tip{grid-column:span 3;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;gap:.7rem;padding:1.6rem 1.2rem;font-size:1.3rem;font-weight:600}.tip:nth-child(n+5){grid-column:span 4}.tip span{font-size:3rem;line-height:1}
.refs{columns:2;column-gap:2vw;column-fill:balance}
.refs li{break-inside:avoid;margin-bottom:1rem;padding:1.1rem 1.25rem}
.refs li::before{content:none}
.refs b{font-size:1.15rem;line-height:1.5;display:block}
.refs a{font-size:1rem;line-height:1.5;word-break:break-word;overflow-wrap:anywhere;display:block;margin-top:.45rem}
.refs small{color:var(--t2);display:block;font-size:1rem;line-height:1.45;margin-top:.45rem}
.hero,.end{justify-content:center;padding:0 7vw 8vh}
.end{align-items:center;text-align:center;padding:0 5vw}
.end .thank-you{font-size:clamp(4.5rem,11vw,10rem);max-width:none;width:100%;line-height:1.02;text-align:center;background:linear-gradient(90deg,#fff 15%,var(--c),var(--v));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 45px rgba(34,211,238,.12)}
.hero>img,.end>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.hero::before,.end::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(16,20,38,.96) 25%,rgba(16,20,38,.55) 70%,rgba(139,92,246,.35));z-index:-1}
.hero h1,.end h1{font-weight:800;font-size:clamp(2.8rem,5.6vw,6rem);line-height:1.05;max-width:16ch;background:linear-gradient(90deg,#fff 40%,var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub,.end .sub{font-size:1.7rem;color:var(--t2);max-width:42ch;margin-top:1.2rem}
.chips{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.8rem}
.chips span{padding:.5rem 1.1rem;border-radius:2rem;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-size:1.15rem}
.fl span{position:absolute;font-size:3rem;animation:fl2 6s ease-in-out infinite alternate;opacity:.85}
@keyframes fl2{to{transform:translateY(-3vh) rotate(8deg)}}
.cred{position:absolute;right:.8rem;bottom:.5rem;font-size:.8rem;color:#fff;opacity:.7;z-index:1}
.ctl{position:fixed;bottom:2.2vh;left:50%;transform:translateX(-50%);display:flex;gap:.8rem;align-items:center;padding:.4rem .8rem;border-radius:3rem;background:rgba(16,20,38,.8);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);z-index:9}
.ctl button{width:2.8rem;height:2.8rem;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:1.4rem;cursor:pointer}
.ctl button:hover{background:var(--v)}#count{min-width:5rem;text-align:center;font-weight:600;font-size:1.1rem}
@media(max-width:800px){.slide{overflow-y:auto;padding:4vh 5vw 14vh}.fit{margin:0}.two,.pn,.vs,.cg,.cg.one,.hd,.dash,.tips{grid-template-columns:1fr!important}.dash .st,.tip{grid-column:auto!important}.refs{columns:1}.refs li{padding:1rem 1.1rem;margin-bottom:.85rem}.ph{min-height:30vh}.cv{height:42vh}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

</style>
</head>

 ['World Economic Forum – The Future of Jobs Report 2025, chapter 1','https://cn.weforum.org/publications/the-future-of-jobs-report-2025/in-full/1-drivers-of-labour-market-transformation/','Employer expectations to 2030'],
 ['World Economic Forum – The Future of Jobs Report 2025: Digest','https://www.weforum.org/publications/the-future-of-jobs-report-2025/digest/','Summary of the same report'],
 ['International Energy Agency – Global EV Outlook 2026: Trends in electric cars','https://www.iea.org/reports/global-ev-outlook-2026/trends-in-electric-cars','Electric car sales in 2025'],
 ['World Health Organization – Digital health','https://www.who.int/health-topics/digital-health','Background for the qualitative health infographic (no adoption statistic is used)']
];
const DECK={SRC,CH,TOPICS,DASH,POS,NEG,TIPS,REFS};

</script>
<script >
  (function(){
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches,live={},FS=Math.round(Math.max(15,Math.min(24,innerWidth/80)));
const valLabels={id:'valLabels',afterDatasetsDraw(ch){if(ch.config.type!=='bar')return;const x=ch.ctx,h=ch.options.indexAxis==='y';x.save();x.fillStyle='#fff';x.font='600 '+(FS+2)+'px Inter,sans-serif';x.textAlign=h?'left':'center';x.textBaseline=h?'middle':'bottom';ch.data.datasets.forEach((d,i)=>ch.getDatasetMeta(i).data.forEach((b,j)=>x.fillText(d.data[j]+'%',h?b.x+8:b.x,h?b.y:b.y-6)));x.restore()}};
const center={id:'center',afterDraw(ch,_,o){if(!o||!o.t)return;const x=ch.ctx,a=ch.chartArea;x.save();x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.font='800 '+Math.min(a.width,a.height)/5+'px Sora,Inter,sans-serif';x.fillText(o.t,(a.left+a.right)/2,(a.top+a.bottom)/2);x.restore()}};
if(typeof Chart!=='undefined'){Chart.register(valLabels,center);Chart.defaults.color='#C5CEE0';Chart.defaults.font.family='Inter,system-ui,sans-serif';Chart.defaults.font.size=FS}
function fallback(cv,c){const ds=c.ds||[{label:'',data:c.data}];cv.parentNode.innerHTML='<p class="note">Chart library unavailable (offline?). Data: '+ds.map(d=>(d.label?d.label+': ':'')+c.labels.map((l,k)=>l+' '+d.data[k]+'%').join(', ')).join(' | ')+'</p>'}
function make(cv,id){
 const c=DECK.CH[id];if(typeof Chart==='undefined')return fallback(cv,c);
 const dn=c.type==='doughnut',ln=c.type==='line',col=c.colors;
 const ds=(c.ds||[{label:c.title,data:c.data}]).map((d,k)=>({label:d.label,data:d.data,backgroundColor:ln?col[k]:col,borderColor:ln?col[k]:dn?'#101426':'transparent',borderWidth:ln?3:dn?3:0,tension:.35,pointRadius:ln?5:0,borderRadius:dn||ln?0:8,fill:false}));
 const o={responsive:true,maintainAspectRatio:false,indexAxis:c.h?'y':'x',animation:RM?false:{duration:1400,easing:'easeOutQuart'},
  plugins:{legend:{display:dn||ln,position:'bottom',labels:{color:'#fff',padding:14,font:{size:FS}}},tooltip:{callbacks:{label:x=>' '+(ln?x.dataset.label+': ':'')+x.formattedValue+'%'}},center:c.center?{t:c.center}:false}};
 if(dn)o.cutout='62%';
 else o.scales={[c.h?'x':'y']:{min:0,max:c.max||100,ticks:{callback:v=>v+'%'},grid:{color:'rgba(255,255,255,.1)'}},[c.h?'y':'x']:{grid:{display:false},ticks:{color:'#fff',font:{size:FS}}}};
 live[id]=new Chart(cv,{type:c.type,data:{labels:c.labels,datasets:ds},options:o});
}
window.Charts={
 show(s){s.querySelectorAll('canvas[data-c]').forEach(cv=>{const id=cv.dataset.c;if(live[id]){live[id].reset();live[id].update();live[id].resize()}else if(!cv.dataset.done){cv.dataset.done=1;make(cv,id)}})},
 resize(){Object.values(live).forEach(c=>c.resize())}
};
})();

</script>
<script>
  (function(){
const {SRC,CH,TOPICS,DASH,POS,NEG,TIPS,REFS}=DECK;
const a=(k,t)=>`<a href="${SRC[k][1]}" target="_blank" rel="noopener noreferrer">${t||SRC[k][0]}</a>`;
const li=x=>`<li>${x}</li>`;
const un=(id,w=1400)=>`https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=${w}&q=70`;
const ph=(id,alt)=>`<div class="ph"><img src="${un(id)}" alt="${alt}" onerror="this.remove()"><span class="cred">Photo: Unsplash</span></div>`;
const sec=(cls,st,lab,h)=>`<section class="slide ${cls}" style="${st}" aria-label="${lab}">${/hero|end/.test(cls)?h:`<div class="fit">${h}</div>`}</section>`;
const ac=t=>`--a:${t.a};--b:${t.b}`;
const logo=e=>`<span class="lg" data-i="${e[0][0]}"><img src="${e[1].startsWith('assets')?e[1]:'https://cdn.simpleicons.org/'+e[1]}" alt="${e[0]} logo" width="32" height="32" decoding="async" loading="eager" fetchpriority="low" onload="this.parentNode.classList.add('loaded')" onerror="this.parentNode.classList.add('x')"></span>`;
const ex=e=>`<li class="ex">${e[1]?logo(e):'<span class="lg t">'+(e[0][0]==='T'?'🩺':'🗂️')+'</span>'}<div><b>${e[0]}</b><small>${e[2]}</small></div></li>`;
const hdr=(k,h,l)=>`<header><p class="k">${k}</p><h2>${h}</h2>${l?`<p class="lead">${l}</p>`:''}</header>`;
const single=id=>{const c=CH[id];return `<div class="cg one">${chart(id,1)}<aside class="card st"><div class="num">${c.big}</div><h3>${c.bl}</h3><p>${c.note}</p></aside></div>`};
const chart=(id,s)=>{const c=CH[id];return `<figure class="card ch"><figcaption><b>${c.title}</b><small>${c.meta}</small></figcaption><div class="cv"><canvas data-c="${id}" role="img" aria-label="${c.title}. ${c.meta}. ${c.note}"></canvas></div>${s?'':`<p class="note">${c.note}</p>`}<p class="src">Source: ${a(c.s)}</p></figure>`};
const S=[];

S.push(sec('hero','','Title',`<img src="${un('1518770660439-4636190af475',1920)}" alt="" onerror="this.remove()">
<div class="fl" aria-hidden="true"><span style="top:12%;left:62%">📱</span><span style="top:30%;left:80%;animation-delay:-2s">🎓</span><span style="top:58%;left:68%;animation-delay:-4s">🩺</span><span style="top:75%;left:85%;animation-delay:-1s">🤖</span><span style="top:18%;left:90%;animation-delay:-3s">💬</span></div>
<h1>Technology and Its Impact on Everyday Life</h1>`));

S.push(sec('','','Introduction',`${hdr('Introduction','What is technology, and why does it matter?','Technology is the practical use of knowledge and tools to solve problems and make tasks easier.')}
<div class="two"><div class="col"><div class="card"><ul><li>Smartphones, computers, internet services and AI are part of our daily routines.</li><li>They create real opportunities: access, speed, convenience and new ideas.</li><li>They also create challenges: privacy, misinformation, distraction and unequal access.</li><li>That is why responsible use matters as much as the technology itself.</li></ul></div>
<p class="take">Let’s look at six areas of life where technology makes a difference →</p>
<div class="chips" style="margin:0"><span>🎓 Education</span><span>🩺 Health</span><span>🎮 Entertainment</span><span>💬 Communication</span><span>💼 Work</span><span>🚗 Daily life</span></div></div>${ph('1519389950473-47ba0277781c','People working together with laptops')}</div>`));

TOPICS.forEach((t,n)=>{
 S.push(sec('',ac(t),t.t,`<div class="hd">${hdr('Topic '+(n+1)+' of 6',t.t,t.intro)}${ph(t.img,t.alt)}</div>
<ul class="exs">${t.ex.map(ex).join('')}</ul>
<div class="pn"><div class="card pos"><h3>Positive impacts</h3><ul>${t.pos.map(li).join('')}</ul></div><div class="card neg"><h3>Negative impacts</h3><ul>${t.neg.map(li).join('')}</ul></div></div>
<p class="take">💡 ${t.take}</p>`));
 const body=t.info?`<div class="cg steps" style="--n:4">${t.info.map(x=>`<div class="card ch"><div class="big">${x[0]}</div><h3>${x[1]}</h3><p class="note">${x[2]}</p></div>`).join('')}</div><p class="note">Qualitative infographic: no verified WHO adoption statistic was used, so no numbers are shown. Background: ${a('who')}</p>`
  :t.cs.length===1?single(t.cs[0]):`<div class="cg" style="--n:${t.cs.length}">${t.cs.map(x=>chart(x)).join('')}</div>`;
 S.push(sec('',ac(t),t.t+' data',`${hdr('Topic '+(n+1)+' · Data',t.dh)}${body}`));
});

S.push(sec('','','Data and statistics dashboard',`${hdr('Data and statistics','The numbers behind the story')}<div class="dash">${DASH.map(d=>`<article class="card st" style="--a:${d[6]}"><div class="num">${d[0]}</div><h3>${d[1]}</h3><p class="meta">${d[2]}</p><p>${d[3]}</p><p class="src">${a(d[4],'Source: '+d[5])}</p></article>`).join('')}</div>`));

const side=(arr,c,h,cls)=>`<div class="card ${cls}" style="--a:${c}"><h3>${h}</h3>${arr.map(x=>`<div class="it"><span>${x[0]}</span><div><b>${x[1]}</b><small>${x[2]}</small></div></div>`).join('')}</div>`;
S.push(sec('','','Positive and negative impacts',`${hdr('Balance','Positive and negative impacts')}<div class="vs">${side(POS,'#34D399','Benefits','pos')}${side(NEG,'#F472B6','Risks','neg')}</div><p class="take">The effects of technology depend on how it is designed and how we use it.</p>`));

S.push(sec('','--a:#34D399;--b:#22D3EE','Responsible technology use',`${hdr('Key takeaways','Using technology responsibly')}<div class="tips">${TIPS.map(x=>`<div class="card tip"><span>${x[0]}</span>${x[1]}</div>`).join('')}</div><p class="take" style="font-size:1.3rem">Technology is most valuable when it improves people’s lives without compromising safety, privacy, or human connection.</p>`));

S.push(sec('refs-slide','','References and further reading',`${hdr('References','References and further reading')}<ul class="refs">${REFS.map(r=>`<li class="card"><b>${r[0]}</b><a href="${r[1]}" target="_blank" rel="noopener noreferrer">${r[1]}</a><small>${r[2]}</small></li>`).join('')}</ul>`));

S.push(sec('end','','Thank you',`<h1 class="thank-you">Thank You!</h1>`));

const deck=document.getElementById('deck');deck.innerHTML=S.join('');
const els=[...deck.children],N=els.length,cnt=document.getElementById('count'),pr=document.getElementById('prog'),bar=document.getElementById('bar'),fsb=document.getElementById('fs');
let i=0;
function go(n){n=Math.max(0,Math.min(N-1,n));els[i].classList.remove('on');i=n;els[i].classList.add('on');cnt.textContent=(i+1)+' / '+N;pr.style.width=((i+1)/N*100)+'%';bar.setAttribute('aria-valuenow',Math.round((i+1)/N*100));history.replaceState(null,'','#'+(i+1));requestAnimationFrame(()=>{fit(els[i]);Charts.show(els[i])})}
function fit(s){const f=s.querySelector('.fit');if(!f)return;f.style.transform='';f.style.width='';if(innerWidth<800)return;const c=getComputedStyle(s),av=s.clientHeight-parseFloat(c.paddingTop)-parseFloat(c.paddingBottom),h=f.offsetHeight;if(h>av){const k=av/h;f.style.transform='scale('+k+')';f.style.width=(100/k)+'%'}}
const refit=()=>{fit(els[i]);Charts.resize()};
const fs=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};
document.getElementById('prev').onclick=()=>go(i-1);document.getElementById('next').onclick=()=>go(i+1);fsb.onclick=fs;
addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;const int=e.target.closest&&e.target.closest('a,button,input,select,textarea');
 if(e.key==='ArrowRight'||e.key==='PageDown'){go(i+1);e.preventDefault()}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(i-1);e.preventDefault()}
 else if(e.key===' '&&!int){go(i+(e.shiftKey?-1:1));e.preventDefault()}
 else if(e.key==='Home')go(0);else if(e.key==='End')go(N-1);else if((e.key==='f'||e.key==='F')&&!int)fs()});
let x0=null;addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>60)go(i+(d<0?1:-1));x0=null});
document.addEventListener('fullscreenchange',()=>{const f=!!document.fullscreenElement;fsb.setAttribute('aria-label',f?'Exit full screen':'Enter full screen');setTimeout(refit,150)});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(refit,120)});
go(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));
if(document.fonts)document.fonts.ready.then(refit);
})();

</script>
</body>
